<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">TPK4128 course learning path</title>
  <desc id="desc">A flowchart from Linux and C foundations through networking, PLC programming, industrial protocols and ROS2.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03070d"/>
      <stop offset="1" stop-color="#09162b"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#38bdf8"/>
    </marker>
    <style>
      .label{font:600 14px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:2px;fill:#38bdf8}
      .title{font:600 28px Inter,Arial,sans-serif;fill:#f4f4f5}
      .body{font:400 16px Inter,Arial,sans-serif;fill:#a1a1aa}
      .step{font:600 19px Inter,Arial,sans-serif;fill:#f4f4f5}
      .tech{font:400 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#a1a1aa}
      .box{fill:#0b111a;stroke:#263241;stroke-width:1.5}
      .num{font:600 12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#38bdf8}
      .line{stroke:#38bdf8;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="720" rx="24" fill="url(#background)"/>

  <text x="72" y="70" class="label">TPK4128 · INDUSTRIAL MECHATRONICS</text>
  <text x="72" y="113" class="title">From low-level code to industrial communication</text>
  <text x="72" y="145" class="body">Separate laboratory assignments connected by a progressive technical foundation.</text>

  <path class="line" d="M294 263H342"/>
  <path class="line" d="M566 263H614"/>
  <path class="line" d="M838 263H886"/>
  <path class="line" d="M998 340V396"/>
  <path class="line" d="M886 507H838"/>
  <path class="line" d="M614 507H566"/>
  <path class="line" d="M342 507H294"/>

  <g transform="translate(70 190)">
    <rect class="box" width="224" height="150" rx="14"/>
    <text x="20" y="28" class="num">01</text>
    <text x="20" y="65" class="step">Linux &amp; C</text>
    <text x="20" y="96" class="tech">UTM · Ubuntu · GCC</text>
    <text x="20" y="122" class="body">Build and debug locally</text>
  </g>
  <g transform="translate(342 190)">
    <rect class="box" width="224" height="150" rx="14"/>
    <text x="20" y="28" class="num">02</text>
    <text x="20" y="65" class="step">Systems programming</text>
    <text x="20" y="96" class="tech">fork · pthread · mutex</text>
    <text x="20" y="122" class="body">Memory and concurrency</text>
  </g>
  <g transform="translate(614 190)">
    <rect class="box" width="224" height="150" rx="14"/>
    <text x="20" y="28" class="num">03</text>
    <text x="20" y="65" class="step">TCP/IP sockets</text>
    <text x="20" y="96" class="tech">client · server · SSH</text>
    <text x="20" y="122" class="body">VM ↔ Raspberry Pi</text>
  </g>
  <g transform="translate(886 190)">
    <rect class="box" width="244" height="150" rx="14"/>
    <text x="20" y="28" class="num">04</text>
    <text x="20" y="65" class="step">PLC logic</text>
    <text x="20" y="96" class="tech">Ladder · OpenPLC</text>
    <text x="20" y="122" class="body">Boolean machine control</text>
  </g>

  <g transform="translate(886 430)">
    <rect class="box" width="244" height="150" rx="14"/>
    <text x="20" y="28" class="num">05</text>
    <text x="20" y="65" class="step">Sequential control</text>
    <text x="20" y="96" class="tech">SFC · steps · transitions</text>
    <text x="20" y="122" class="body">Production-line sequencing</text>
  </g>
  <g transform="translate(614 430)">
    <rect class="box" width="224" height="150" rx="14"/>
    <text x="20" y="28" class="num">06</text>
    <text x="20" y="65" class="step">OPC UA</text>
    <text x="20" y="96" class="tech">methods · subscriptions</text>
    <text x="20" y="122" class="body">Control and event logging</text>
  </g>
  <g transform="translate(342 430)">
    <rect class="box" width="224" height="150" rx="14"/>
    <text x="20" y="28" class="num">07</text>
    <text x="20" y="65" class="step">MQTT telemetry</text>
    <text x="20" y="96" class="tech">publish · broker · subscribe</text>
    <text x="20" y="122" class="body">Sensor data distribution</text>
  </g>
  <g transform="translate(70 430)">
    <rect class="box" width="224" height="150" rx="14"/>
    <text x="20" y="28" class="num">08</text>
    <text x="20" y="65" class="step">ROS2</text>
    <text x="20" y="96" class="tech">topics · services · actions</text>
    <text x="20" y="122" class="body">Modular system communication</text>
  </g>

  <text x="72" y="655" class="body">CONTROL FOUNDATION</text>
  <line x1="252" y1="649" x2="948" y2="649" stroke="#263241"/>
  <text x="970" y="655" class="body">MIDDLEWARE</text>
</svg>
